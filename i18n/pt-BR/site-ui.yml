facts.methodLines: "Linhas de código e de comentário: linhas do arquivo-fonte principal (o arquivo que exibe a saudação) que contêm código e linhas que contêm apenas um comentário. As linhas em branco não são contadas. Um comentário após o código na mesma linha conta como código."
facts.methodFiles: "Arquivos-fonte: arquivos da pasta no git, exceto o README, os scripts .sh, os arquivos de bloqueio de dependências (lock files) e as imagens."
facts.methodDeps: "Dependências diretas: pacotes nomeados nos arquivos package.json, Cargo.toml, go.mod, requirements.txt, pom.xml, .csproj ou .cabal da pasta. A toolchain e sua biblioteca padrão não são contadas."
facts.methodSteps: "Etapas do script: as etapas que build.sh e run.sh anunciam enquanto são executados."
facts.methodBuild: "Saída da compilação (somente implementações de linha de comando): o tamanho de cada arquivo que build.sh grava na pasta e que o git ignora, incluídos os caches do compilador."
facts.methodTime: "Tempo de execução (somente implementações de linha de comando): depois de build.sh e de uma execução de aquecimento, run.sh é executado {runs} vezes e mantém-se a mediana do tempo real decorrido. Esse tempo inclui o script de shell e a inicialização do interpretador ou do runtime; portanto, mede o que o leitor espera, não a velocidade da linguagem."
