genealogy.title: "Genealogia"
genealogy.description: "Quais linguagens influenciaram as linguagens deste repositório, em uma linha do tempo. Cada influência é citada com as palavras de sua fonte."
genealogy.intro: "Cada linguagem deste repositório é posicionada no ano em que surgiu. Uma seta significa que uma fonte citada liga a linguagem anterior à posterior: como influência, base ou modelo com o qual se assemelha. A tabela reproduz as palavras exatas de cada fonte. As influências de linguagens externas a este repositório estão listadas na tabela."
