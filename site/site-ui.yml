# site/site-ui.yml - the English strings of the site's own components: the
# menu, the Home banner, the language cards, the timeline and the labels the
# generator adds around the repository Markdown. The Markdown itself
# (README files, docs/) is not here.
#
# English is the source of truth. A translation is i18n/<tag>/site-ui.yml
# with the same keys (a missing key falls back to English) plus `source` and
# `source_sha` (see i18n/README.md). "{name}" is a placeholder filled in by
# the code; keep it as is in a translation.
# Read by site/i18n.mjs.

site.title: "Hello World in many languages"
site.description: "The Hello World program in many programming languages, as a command-line app, a desktop window and a web app, with the cited history of each language."

