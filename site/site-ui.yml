facts.methodLines: "Code and comment lines: lines of the main source file (the file that prints the greeting) that hold code, and lines that hold only a comment. Blank lines are not counted. A comment after code on the same line counts as code."
facts.methodFiles: "Source files: files of the folder in git, except the README, the .sh scripts, lock files and images."
facts.methodDeps: "Direct dependencies: packages named in the folder's package.json, Cargo.toml, go.mod, requirements.txt, pom.xml, .csproj or .cabal files. The toolchain and its standard library are not counted."
facts.methodSteps: "Script steps: the steps that build.sh and run.sh announce while they run."
facts.methodBuild: "Build output (command-line implementations only): the size of every file that build.sh writes into the folder and git ignores, compiler caches included."
facts.methodTime: "Run time (command-line implementations only): after build.sh and one warm-up run, run.sh runs {runs} times and the median wall-clock time is kept. It includes the shell script and the start of the interpreter or runtime, so it measures what a reader waits for, not the speed of the language."
