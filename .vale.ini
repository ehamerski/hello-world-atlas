# .vale.ini - Vale (prose linter) settings for this repository.
#
# WHAT: checks the Markdown files against docs/contributing/style-guide.md:
#   US English spelling, filler words, preferred terms, British spellings,
#   contractions, and the markers of internal work notes.
# HOW:  scripts/check-prose.sh runs Vale on the published Markdown files.
# Docs: https://vale.sh/docs/

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = HelloWorld

[*.md]
BasedOnStyles = Vale, HelloWorld
# Quoted text keeps its original spelling and contractions
# (style-guide.md, section 4), so text between double quotation marks
# is not checked.
TokenIgnores = ("[^"]+"), ("[^"]+"), \bpharo\b, \bmorphic\b
