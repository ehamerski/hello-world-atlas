    # JavaFX stays on the 21 line, which runs on JDK 21 LTS; newer majors
    # need a newer JDK (JavaFX 27 is built for Java 25).
    ignore:
      - dependency-name: 'org.openjfx:*'
        update-types: ['version-update:semver-major']

