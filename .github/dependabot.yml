# .github/dependabot.yml - which dependency files Dependabot keeps up to date.
#
# WHAT: one entry per folder that has a manifest or lockfile, for the
#   website (npm), the workflows (github-actions, which also updates the
#   commit SHAs the actions are pinned to) and the implementations that
#   pin libraries. Each entry checks once a week, puts every update for
#   that folder into one pull request, and keeps at most two open.
# WHEN: Dependabot version updates run on GitHub Actions; while Actions is
#   turned off for the repository this file starts nothing.
# NOT LISTED: npm in the implementation folders (their frontends and
#   tools are small and pinned; Dependabot alerts still cover those
#   lockfiles), the other .NET projects (they use no NuGet package), and
#   Clojure (deps.edn) and Haskell (cabal.project.freeze), which have no
#   Dependabot ecosystem.
#
# References:
#   Options reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /languages/rust/cli
