# Cargo.toml - the manifest of this package: name, Rust edition, and the
# crates (libraries) it depends on. Cargo downloads them from crates.io and
# records the exact versions in Cargo.lock.
# Format: https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
# The name of the package and of the executable: target/release/hello-desktop.
name = "hello-desktop"
version = "0.1.0"
# The edition picks the language rules for this crate (see ../cli).
edition = "2024"
# The oldest Rust this package builds with: eframe 0.37 declares 1.95.
rust-version = "1.95"
publish = false

[dependencies]
# eframe: the official framework of the egui GUI library. It opens the
# native window and draws egui into it with wgpu, a graphics library that
# uses each system's own graphics API (Metal on macOS). "0.37" means any 0.37.x
# release, never 0.38 (Cargo's default "caret" rule; before 1.0, the second
# number is the one that may break your code).
# Default features are turned off and the list below is the default list
# minus "accesskit" (screen-reader bridge), "wayland" (native Wayland window
# decorations), "winit/default" and "web_screen_reader" (web only). The first three pull crates (zbus,
# zvariant, ttf-parser) that have open security advisories with no patched
# release. Without them Linux uses X11 (also under Wayland through
# XWayland) and has no AT-SPI screen-reader support; macOS and Windows are
# unaffected.
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "links", "system_fonts", "wgpu", "x11"] }
