# languages/cobol/meta.yml - facts about this language, read by
# scripts/gen-readme.py. Schema: languages/README.md#metayml-schema.
# year and designers are cited in README.md; the same sources are below.
name: "COBOL"
year: 1959
year_note: "Pentagon meeting and CODASYL in May 1959; COBOL-60 report published April 1960"
designers:
  - "CODASYL"
paradigms:
  - "imperative"
# influenced_by: each influence cited with the exact words of its source (website Genealogy page).
influenced_by:
  - language: "FLOW-MATIC"
    title: "Grace Murray Hopper (history page). Yale University, Department of Computer Science"
    url: "https://cs.yale.edu/homes/tap/Files/hopper-story.html"
    quote: "The design was greatly influenced by FLOW-MATIC."
categories:
  - folder: "cli"
    kind: "cli"
    toolchain: "GnuCOBOL"
    run: "prints `Hello, World!`"
    status: "verified"
sources:
  - title: "FIPS PUB 21-2, COBOL (ANSI X3.23-1985, ISO 1989-1985), Appendix \"Development of COBOL\". National Institute of Standards and Technology, 1986"
    url: "https://nvlpubs.nist.gov/nistpubs/Legacy/FIPS/fipspub21-2.pdf"
  - title: "FIPS PUB 21-1, COBOL (ANSI X3.23-1974), Appendix \"History of COBOL\". National Institute of Standards and Technology"
    url: "https://nvlpubs.nist.gov/nistpubs/Legacy/FIPS/fipspub21-1.pdf"
# humor: one light line for the Off the record page and the box at the
# end of the language page (languages/README.md#humor-keys).
humor:
  line: "COBOL asks a program to state its name in an IDENTIFICATION DIVISION before it may say anything at all. It is the most polite language in this repository."
  dictionary:
    - term: "COBOL"
      definition: "a language that writes `ADD A TO B GIVING C`, so that a program can be read aloud at a meeting."
