# gradle.properties - settings read by Gradle for every build of this project.
# Each line is "key=value". Gradle reads it before the build scripts run.

# Use the AndroidX libraries (the maintained Android support libraries that
# Compose depends on). Without this, AGP refuses to build the project.
android.useAndroidX=true

# The official code style for Kotlin, as the Kotlin documentation defines it.
kotlin.code.style=official

# Give the Gradle daemon 2 GB of heap. Gradle's default is 512 MB, which the
# Android packaging step can exhaust and then fail with an OutOfMemoryError
# (Gradle docs: "Configuring the build environment", org.gradle.jvmargs).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
