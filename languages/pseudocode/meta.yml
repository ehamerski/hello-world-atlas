designers: []
paradigms:
  - "imperative"
  - "teaching"
categories:
  - folder: "portugol"
    kind: "cli"
    label: "Portugol"
    toolchain: "Delégua interpreter (VisuAlg dialect), via npm"
    run: "prints `Hello, World!`"
    status: "verified"
  - folder: "pseint"
    kind: "cli"
    label: "PSeInt"
    toolchain: "PSeInt"
    run: "prints `Hello, World!`"
    status: "verified"
  - folder: "clrs"
    kind: "cli"
    label: "CLRS"
