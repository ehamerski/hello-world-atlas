  - title: "PSeInt project page. SourceForge"
    url: "https://sourceforge.net/projects/pseint/"
  - title: "Esteves, A. M. S.; Noschang, L. F.; Raabe, A. L. A.; Haendchen Filho, A. Portugol Studio: Em direção a uma comunidade aberta para pesquisa sobre o aprendizado de programação. WEI 2019. SBC OpenLib"
    url: "https://sol.sbc.org.br/index.php/wei/article/download/6656/6552"
