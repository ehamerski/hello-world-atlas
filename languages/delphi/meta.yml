# languages/delphi/meta.yml - facts about this language, read by
# scripts/gen-readme.py. Schema: languages/README.md#metayml-schema.
# year and designers are cited in README.md; the same sources are below.
name: "Delphi (Object Pascal dialect)"
year: 1995
year_note: "Delphi 1.0 launched by Borland on 14 February 1995 (16-bit Windows); Delphi 13.2 by Embarcadero is the current version"
designers:
  - "Anders Hejlsberg"
paradigms:
  - "imperative"
  - "object-oriented"
categories:
  - folder: "cli"
    kind: "cli"
    toolchain: "Free Pascal 3.2.2 in Delphi mode (`{$mode delphi}`)"
    run: "prints `Hello, World!`"
    status: "compromise"
    note: "Delphi dialect compiled by Free Pascal 3.2.2 in Delphi mode; Embarcadero Delphi itself is not used"
  - folder: "desktop"
    kind: "desktop"
    toolchain: "Lazarus 4.8 (LCL, Cocoa) with Free Pascal 3.2.2"
    run: "window"
    status: "compromise"
    note: "Delphi dialect built with Lazarus 4.8 and Free Pascal 3.2.2; Embarcadero Delphi itself is not used"
sources:
  - title: "Celebrating the 30th Anniversary of Delphi Version 1.0's Launch, Embarcadero blog, 14 February 2025"
    url: "https://blogs.embarcadero.com/celebrating-the-30th-anniversary-of-delphi-version-1-0s-launch/"
  - title: "Celebrating Delphi's anniversary. Embarcadero"
    url: "https://delphi.embarcadero.com/"
