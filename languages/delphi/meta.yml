    url: "https://www.freepascal.org/docs-html/ref/refch6.html"
  - title: "Free Pascal User's Guide (compiler modes)"
    url: "https://gitlab.com/freepascal.org/fpc/documentation/-/blob/main/tex/user.tex"
  - title: "Lazarus home page"
    url: "https://www.lazarus-ide.org/"
