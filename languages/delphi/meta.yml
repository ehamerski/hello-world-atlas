# humor: one light line for the Off the record page.
humor:
  line: "Delphi is the language that makes you feel productive before you have finished reading the form designer."
  dictionary:
    - term: "Delphi"
      definition: "an oracle that answers every question with a form, a label and a button you did not ask for."
