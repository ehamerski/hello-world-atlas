    url: "https://news.microsoft.com/source/2001/04/11/microsofts-anders-hejlsberg-receives-prestigious-excellence-in-programming-award/"
  - title: "Delphi product page. Embarcadero"
    url: "https://www.embarcadero.com/products/delphi"
  - title: "25 years of Delphi, The Register, 14 February 2020"
    url: "https://www.theregister.com/software/2020/02/14/25-years-of-delphi-and-no-oracle-in-sight-not-a-visual-basic-killer-but-hard-to-kill/360875"
