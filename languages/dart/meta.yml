# languages/dart/meta.yml - facts about this language, read by
# scripts/gen-readme.py. Schema: languages/README.md#metayml-schema.
# year and designers are cited in README.md; the same sources are below.
name: "Dart"
year: 2011
year_note: "early preview introduced 2011-10-10; Dart 1.0 released 2013-11-14"
designers:
  - "Lars Bak"
paradigms:
  - "object-oriented"
categories:
  - folder: "cli"
    kind: "cli"
    toolchain: "Dart SDK"
    run: "prints `Hello, World!`"
    status: "verified"
  - folder: "web"
    kind: "web"
    toolchain: "`dart:io` HttpServer"
    run: "http://localhost:8080/"
    status: "verified"
  - folder: "mobile-flutter"
    kind: "mobile"
    toolchain: "Flutter 3.47.9 (Android)"
    run: "prints `Hello, World!` on the Android emulator"
    status: "verified"
    note: "Android verified on macOS Intel; the iOS side of the app is not built or run"
sources:
  - title: "Classes. Dart Team, Google"
    url: "https://dart.dev/language/classes"
  - title: "Dart: a language for structured web programming. Lars Bak, Google Code Blog"
    url: "https://web.archive.org/web/20121114043040/http://googlecode.blogspot.com/2011/10/dart-language-for-structured-web.html"
# humor: one light line for the Off the record page and the box at the
# end of the language page (languages/README.md#humor-keys).
humor:
  line: "Dart was created to replace JavaScript, but JavaScript replaced itself instead. Dart found a better home with Flutter."
  dictionary:
    - term: "Dart"
      definition: "a language that was born to fix the web, grew up to build apps, and now nobody remembers why it started."
