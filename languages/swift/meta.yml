# languages/swift/meta.yml - facts about this language, read by
# scripts/gen-readme.py. Schema: languages/README.md#metayml-schema.
# year and designers are cited in README.md; the same sources are below.
name: "Swift"
year: 2014
year_note: "announced at WWDC 2014-06-02; open-sourced 2015-12-03"
designers:
  - "Chris Lattner"
paradigms:
  - "multi-paradigm"
  - "object-oriented"
  - "functional"
# influenced_by: each influence cited with the exact words of its source.
influenced_by:
  - language: "Objective-C"
    slug: "objectivec"
    title: "Chris Lattner's Homepage"
    url: "https://nondot.org/sabre/"
    quote: "drawing ideas from Objective-C, Rust, Haskell, Ruby, Python, C#, CLU, and far too many others to list."
  - language: "Rust"
    title: "Chris Lattner's Homepage"
    url: "https://nondot.org/sabre/"
    quote: "drawing ideas from Objective-C, Rust, Haskell, Ruby, Python, C#, CLU, and far too many others to list."
  - language: "Haskell"
    title: "Chris Lattner's Homepage"
    url: "https://nondot.org/sabre/"
    quote: "drawing ideas from Objective-C, Rust, Haskell, Ruby, Python, C#, CLU, and far too many others to list."
categories:
  - folder: "cli"
    kind: "cli"
    toolchain: "Swift 6 (swiftc)"
    run: "prints `Hello, World!`"
    status: "verified"
  - folder: "desktop"
    kind: "desktop"
    toolchain: "SwiftUI + AppKit"
    run: "window"
    status: "verified"
  - folder: "web"
    kind: "web"
    toolchain: "Vapor 4"
    run: "http://localhost:8080/"
    status: "verified"
  - folder: "mobile-ios"
    kind: "mobile"
    toolchain: "SwiftUI + iOS Simulator (full Xcode)"
    run: "app in the iOS Simulator"
    status: "verified"
sources:
  - title: "Apple Releases iOS 8 SDK With Over 4,000 New APIs. Apple Inc., 2014-06-02"
    url: "https://www.apple.com/newsroom/2014/06/02Apple-Releases-iOS-8-SDK-With-Over-4-000-New-APIs/"
  - title: "Apple Releases Swift as Open Source. Apple Inc., 2015-12-03"
    url: "https://www.apple.com/newsroom/2015/12/03Apple-Releases-Swift-as-Open-Source/"
  - title: "Chris Lattner's Homepage"
    url: "https://nondot.org/sabre/"
  - title: "Swift CHANGELOG. The Swift Project on GitHub"
    url: "https://github.com/swiftlang/swift/blob/main/CHANGELOG.md"
  - title: "The Swift Programming Language, About Swift. Swift.org"
    url: "https://docs.swift.org/latest/documentation/the-swift-programming-language/aboutswift/"
  - title: "Vapor. Vapor.codes"
    url: "https://vapor.codes/"
# humor: one light line for the Off the record page and the box at the
# end of the language page (languages/README.md#humor-keys).
humor:
  line: "Swift was named for speed, but its compile times remind us that even fast languages need a moment to think."
  dictionary:
    - term: "Swift"
      definition: "a language so modern it still remembers what Objective-C looked like."
