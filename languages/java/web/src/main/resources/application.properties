# application.properties - Java web: settings Spring Boot reads at start-up.
# Maven copies src/main/resources into the jar, so these travel with the app.
# Reference: https://docs.spring.io/spring-boot/reference/features/external-config.html

# The port to listen on: the PORT environment variable if it is set,
# otherwise 8080 (the "${NAME:default}" placeholder syntax).
server.port=${PORT:8080}

# Listen on 127.0.0.1 only, so the page is reachable from this computer
# and not from the network (the same choice as the Python web version).
server.address=127.0.0.1
