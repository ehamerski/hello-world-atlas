# application.properties - Java web-react (backend): settings Spring Boot
# reads at start-up. Maven copies src/main/resources into the jar.
# Reference: https://docs.spring.io/spring-boot/reference/features/external-config.html

# The port of the API: the PORT environment variable if it is set,
# otherwise 8080. The front end's vite.config.js reads the same variable,
# so both sides agree on where the API is.
server.port=${PORT:8080}

# Listen on 127.0.0.1 only: the API is reachable from this computer, not
# from the network.
server.address=127.0.0.1
