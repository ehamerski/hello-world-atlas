<!doctype html>
<!--
  index.html - Java web-react (frontend): the only HTML page of the app.
  It is almost empty on purpose: React fills <div id="root"> in the
  browser. Compare ../../web, where the Spring Boot server sends the
  finished HTML itself.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite loads the React code from here (and bundles it on build). -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
