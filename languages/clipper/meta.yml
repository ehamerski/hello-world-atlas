    title: "The CA-Clipper Story. Greg Holmes, The Holmes Page (a third-party history, not a vendor document)"
    url: "https://ghservices.com/gregh/clipper/story.htm"
    quote: "They were expressing their annoyance at the fact that Ashton-Tate had not created a compiler for the dBase language."
categories:
  - folder: "cli"
    kind: "cli"
    toolchain: "Harbour"
